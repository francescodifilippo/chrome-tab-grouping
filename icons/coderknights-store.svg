<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background -->
  <rect width="128" height="128" rx="20" fill="#1a1a2e"/>

  <!-- Knight chess piece -->
  <text x="64" y="78" font-size="68" text-anchor="middle" fill="#ffffff" font-family="serif">♞</text>

  <!-- Accent bar -->
